[package]
name = "sortu-portable"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "sortu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
